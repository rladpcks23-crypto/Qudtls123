<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>공부모드 배경화면</title>
<style>
  :root {
    --ink: #f3ead8;
    --dim: rgba(240, 222, 186, .55);
    --faint: rgba(240, 222, 186, .3);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; cursor: default; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hud {
    position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; color: var(--ink);
    font-family: "Segoe UI Variable Display", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .top { top: 5vh; }
  .bottom { bottom: 12vh; }
  .clock { font-size: clamp(40px, 5.6vw, 96px); font-weight: 200; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .date { margin-top: 8px; font-size: clamp(13px, 1.1vw, 18px); color: var(--dim); letter-spacing: .08em; }
  .dday { display: flex; align-items: baseline; justify-content: center; gap: 14px; }
  .dday .num { font-size: clamp(34px, 4.2vw, 72px); font-weight: 700;
    background: linear-gradient(90deg, #f7d77e, #c8912b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .dday .lbl { font-size: clamp(13px, 1.1vw, 19px); color: var(--dim); }
  .msg { margin: 12px auto 0; max-width: min(80vw, 900px); font-size: clamp(15px, 1.5vw, 24px); opacity: .9; }
  .stats { position: fixed; left: 0; right: 0; bottom: 4.5vh; text-align: center; pointer-events: none;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif; font-size: clamp(12px, .95vw, 15px); color: var(--faint); letter-spacing: .06em; }
  .stats b { color: var(--dim); font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hud top">
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
</div>
<div class="hud bottom">
  <div class="dday hidden" id="dday"><span class="num" id="ddayNum"></span><span class="lbl" id="ddayLbl"></span></div>
  <div class="msg" id="msg"></div>
</div>
<div class="stats" id="stats"></div>

<script src="exam.js"></script>
<script src="eye.js"></script>
<script>
// ---------- HUD ----------
let st = null;
const $ = (id) => document.getElementById(id);
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const pad = (n) => String(n).padStart(2, "0");

function renderHud() {
  const now = new Date();
  $("clock").textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  $("date").textContent = `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}. ${WEEK[now.getDay()]}요일`;
  if (!st) return;
  $("msg").textContent = st.config.message || "";
  const es = examStatus(st.config, now);
  $("dday").classList.toggle("hidden", !es);
  if (es) { $("ddayNum").textContent = es.big; $("ddayLbl").textContent = es.label; }
  const todayKey = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const blocks = st.stats && st.stats.date === todayKey ? st.stats.blocks : 0;
  $("stats").innerHTML = `오늘 참은 유혹 <b>${blocks}</b>번${st.locked ? " · 잠금 중" : ""}`;
}

// ---------- scene ----------
// With two monitors each gets one eye of a pair: "left" is mirrored so the
// tails point outwards, and the text is split between the screens.
const SIDE = new URLSearchParams(location.search).get("side") || "single";
if (SIDE === "left") document.querySelector(".bottom").classList.add("hidden");
if (SIDE === "right") document.querySelector(".top").classList.add("hidden");

const cv = $("sky");
const ctx = cv.getContext("2d");
const eye = new Eye();
eye.flip = SIDE === "left";
let W = 0, H = 0, DPR = 1;
let eyeCss = { x: 0, y: 0 };
let lastMove = 0, nextGlance = 0;
// Seeded by wall-clock time so the two eyes (separate windows) glance together.
const seeded = (n) => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
  cv.width = W; cv.height = H;
  const eh = Math.min(H * 0.26, (W * 0.5) / 1.75);
  eye.setSize(eh * 1.75, eh);
  // Nudge the pair towards each other so they read as one face.
  const nudge = SIDE === "left" ? 0.06 : SIDE === "right" ? -0.06 : 0;
  eyeCss = { x: innerWidth * (0.5 + nudge), y: innerHeight * (SIDE === "single" ? 0.44 : 0.47) };
}
addEventListener("resize", resize);
resize();

function follow(x, y) {
  // The eye itself sits off the emblem's centre (the tail takes the rest).
  const ex = eyeCss.x + (eye.flip ? 1 : -1) * (eye.w * 0.18) / DPR;
  const dx = x - ex, dy = y - eyeCss.y;
  eye.lookAt(Math.tanh(dx / (innerWidth * 0.3)), Math.tanh(dy / (innerHeight * 0.3)));
  lastMove = performance.now();
}

let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  if (t - last < 33) return;
  const dt = Math.min(t - last, 100); last = t;

  // Cursor idle for a while: let the eye wander on its own.
  if (t - lastMove > 12000 && t > nextGlance) {
    const slot = Math.floor(Date.now() / 3000);
    eye.lookAt(seeded(slot) * 1.6 - 0.8, seeded(slot + 0.5) * 1.2 - 0.6);
    nextGlance = t + 500;
  }
  eye.update(dt, t);

  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, W, H);

  eye.draw(ctx, eyeCss.x * DPR, eyeCss.y * DPR, t);
}
requestAnimationFrame(frame);

// ---------- wiring ----------
if (window.studylock) {
  window.studylock.onState((s) => { st = s; renderHud(); });
  window.studylock.getState().then((s) => { st = s; renderHud(); });
  // The window sits behind the desktop icons and never gets mouse events,
  // so the main process feeds us the cursor position.
  window.studylock.onCursor((p) => follow(p.x, p.y));
  window.studylock.onAnger((ms) => eye.anger(ms));
}
addEventListener("mousemove", (e) => follow(e.clientX, e.clientY)); // dev preview
renderHud();
setInterval(renderHud, 1000);
</script>
</body>
</html>
