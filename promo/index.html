<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>레드라인 소개 영상</title>
<link rel="stylesheet" href="fonts/gf/local.css">
<style>
@font-face{font-family:'Pretendard';font-weight:900;font-display:block;src:url(fonts/Pretendard-Black.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:800;font-display:block;src:url(fonts/Pretendard-ExtraBold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:block;src:url(fonts/Pretendard-Bold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:block;src:url(fonts/Pretendard-Medium.woff2) format('woff2')}
/* 앱 기본(다크) 팔레트 그대로 */
:root{--g:#0A0908;--s:#15110D;--s2:#1E1811;--l:#2E2620;--ls:#211B15;--t:#F4F0EA;--m:#A79D90;--f:#857C71;
  --a:#FFA51F;--ad:#6B4409;--c:#FF4438;--cd:#4A1610;--go:#4ADE80;--hu:#7A4E0C}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:'IBM Plex Sans KR',sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--g);transform-origin:0 0}
.L{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#cam{transform-origin:960px 540px}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;transform-origin:960px 540px}
.a{position:absolute}
.mono{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace}
.eb{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--f);white-space:nowrap}
.num{font-family:'Saira Condensed','IBM Plex Sans KR',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.cap{position:absolute;font-family:'Pretendard',sans-serif;font-weight:900;letter-spacing:-.04em;color:var(--t);white-space:nowrap}
.cap .ln{display:block}
.w{display:inline-block;position:relative;transform-origin:50% 85%;opacity:0}
.hl{color:var(--a)} .red{color:var(--c)}
.mk{position:absolute;left:-.06em;right:-.06em;bottom:.04em;height:.36em;background:var(--ad);z-index:-1;transform-origin:0 50%;transform:scaleX(0)}
.red .mk{background:var(--cd)}
.card{position:absolute;background:var(--s);border:2px solid var(--l)}
.ch{display:flex;justify-content:space-between;align-items:center;height:72px;padding:0 30px;border-bottom:2px solid var(--l);background:var(--s2)}
.ch .eb{font-size:21px}
.cur{display:inline-block;width:.55em;height:1em;background:var(--a);vertical-align:-.15em;margin-left:.1em}
/* 워드마크 */
.wm{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:250px;line-height:.8;letter-spacing:.015em;white-space:nowrap;color:var(--t)}
.wl{display:inline-block;transform-origin:50% 100%}
/* D-day */
.dnum{display:flex;align-items:flex-end;font-weight:800;font-size:480px;line-height:1;color:var(--t);letter-spacing:-.035em;white-space:nowrap}
.dpre{font-size:150px;color:var(--a);line-height:1;margin-right:6px;display:inline-block;transform-origin:50% 100%}
.dg{display:inline-block;height:440px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(transparent 0,#000 10%,#000 90%,transparent)}
.dstrip{display:block;will-change:transform}
.dstrip b{display:block;height:440px;line-height:440px;text-align:center;font-weight:800}
.zone{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:24px;letter-spacing:.12em;padding:8px 16px;border:2px solid var(--l);color:var(--m);white-space:nowrap;display:inline-block}
/* 지표 타일 */
.tile{width:400px;height:250px;padding:28px 30px;transform-origin:200px 125px}
.tbar{position:absolute;left:-2px;top:-2px;height:5px;width:calc(100% + 4px);background:var(--a);transform-origin:0 50%}
.tk{font-size:22px;letter-spacing:.12em}
.td{font-size:19px;color:var(--f);margin-top:8px;white-space:nowrap}
.tv{position:absolute;right:30px;bottom:20px;font-weight:700;font-size:118px;line-height:1;color:var(--t);white-space:nowrap}
.tv small{font-size:40px;color:var(--m);margin-left:6px;font-weight:600}
/* 순공 통계 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--s);border:2px solid var(--l);border-top:4px solid var(--ad);padding:16px 24px;opacity:0}
.stat .k{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:19px;letter-spacing:.1em;color:var(--f);display:block}
.stat .v{font-family:'Saira Condensed','IBM Plex Sans KR',sans-serif;font-weight:700;font-size:60px;line-height:1.1;display:block;margin-top:4px;white-space:nowrap}
.stat .v small{font-size:26px;color:var(--m);margin-left:4px;font-weight:600}
/* 버튼류 */
.btn{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:24px;letter-spacing:.08em;background:var(--s2);border:2px solid var(--l);color:var(--t);padding:12px 26px;display:inline-block;white-space:nowrap}
.btn.pri{background:var(--a);border-color:var(--a);color:var(--g);font-weight:600}
/* 체크리스트 */
.todo{list-style:none;margin:0;padding:10px 40px 0}
.todo li{display:flex;align-items:center;gap:22px;height:86px;border-bottom:2px solid var(--ls);font-size:33px;font-weight:500;position:relative;opacity:0}
.todo li:last-child{border-bottom:0}
.cb{width:36px;height:36px;border:2.5px solid var(--f);flex:0 0 auto;position:relative}
.cbf{position:absolute;inset:-2.5px;background:var(--a);transform:scale(0)}
.cbm{position:absolute;left:0;top:0;width:36px;height:36px;overflow:visible}
.lbl{position:relative;white-space:nowrap}
.strike{position:absolute;left:-4px;right:-4px;top:54%;height:3px;background:var(--f);transform-origin:0 50%;transform:scaleX(0)}
.allclear{margin:18px 40px 0;padding:16px 20px;border:2px solid var(--go);font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-size:23px;letter-spacing:.08em;color:var(--go);opacity:0;transform-origin:0 50%}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="L" width="1920" height="1080"></canvas>
  <div id="mq" class="L"></div>
  <div id="cam" class="L">
    <canvas id="fx" class="L" width="1920" height="1080"></canvas>
  </div>
  <div id="wipe" class="L"></div>
  <div id="hud" class="L"></div>
  <canvas id="grain" class="L" width="960" height="540" style="width:1920px;height:1080px;mix-blend-mode:overlay;opacity:.5"></canvas>
  <div id="vig" class="L" style="background:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%)"></div>
  <div id="flash" class="L" style="opacity:0"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="hb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="hbS" stdDeviation="0 0"/></filter>
    <filter id="vb0" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur id="vb0S" stdDeviation="0 0"/></filter>
    <filter id="vb1" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur id="vb1S" stdDeviation="0 0"/></filter>
    <filter id="vb2" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur id="vb2S" stdDeviation="0 0"/></filter>
  </defs>
</svg>
<script>
(function(){
"use strict";
const W=1920,H=1080,DUR=30.5,FPS=60,LEAD=.05;
const QS=new URLSearchParams(location.search), CAPTURE=QS.has('capture');

/* ---------- 수학 / 이징 ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const sstep=(a,b,x)=>{const t=inv(a,b,x);return t*t*(3-2*t);};
const E={
  oC:x=>1-Math.pow(1-x,3), iC:x=>x*x*x, ioC:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  oQ:x=>1-Math.pow(1-x,5), oX:x=>x>=1?1:1-Math.pow(2,-10*x), iX:x=>x<=0?0:Math.pow(2,10*x-10),
  ioQ:x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2,
  oB:(x,s=1.7)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2),
  iB:(x,s=1.7)=>(s+1)*x*x*x-s*x*x,
};
// 감쇠 스프링: 0 → 1, 오버슈트 있음 (f: Hz, z: 감쇠비)
function spring(tau,f=3,z=.4){ if(tau<=0) return 0; const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*tau)*(Math.cos(wd*tau)+(z*w/wd)*Math.sin(wd*tau)); }
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const $=id=>document.getElementById(id);
function mk(p,cls,html,css){const d=document.createElement('div');if(cls)d.className=cls;if(html!=null)d.innerHTML=html;if(css)d.style.cssText=css;p.appendChild(d);return d;}
const f2=v=>(+v).toFixed(2), f4=v=>(+v).toFixed(4);
function T(el,x,y,s,r,o){el.style.transform=`translate(${f2(x)}px,${f2(y)}px) rotate(${f2(r||0)}deg) scale(${f4(s)})`; if(o!==undefined) el.style.opacity=f4(clamp(o));}
function T2(el,x,y,sx,sy,r,o){el.style.transform=`translate(${f2(x)}px,${f2(y)}px) rotate(${f2(r||0)}deg) scale(${f4(sx)},${f4(sy)})`; if(o!==undefined) el.style.opacity=f4(clamp(o));}
// 팝: t0에 시작해서 스프링으로 튀어나온다
function pp(t,t0,o){ o=o||{}; const tau=t-t0;
  if(tau<0) return {o:0,s:o.s0??.3,x:o.x0??0,y:o.y0??0,r:o.r0??0,k:0,on:false};
  const k=spring(tau,o.f??3.2,o.z??.38);
  return {o:clamp(tau/(o.fd??.07)),s:lerp(o.s0??.3,1,k),x:lerp(o.x0??0,0,k),y:lerp(o.y0??0,0,k),r:lerp(o.r0??0,0,k),k,on:true}; }
const fmt=(v,dec,comma)=>{let s=v.toFixed(dec); if(comma){const [i,d]=s.split('.'); s=i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(d?'.'+d:'');} return s;};
const hms=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');};

/* ---------- 효과 레지스트리 (오디오와 공유) ---------- */
const RINGS=[],BURSTS=[],FLASHES=[],SHAKES=[],IMPL=[],SFX=[];
const R=rng(20261009);
function ring(t,x,y,r0,r1,life,c,w,a){RINGS.push({t,x,y,r0,r1,life,c,w,a:a??1});}
function flash(t,a,c,life){FLASHES.push({t,a,c,life:life??.25});}
function shake(t,amp,life){SHAKES.push({t,amp,life:life??.4,p1:R()*99,p2:R()*99,p3:R()*99});}
function sfx(t,type,o){SFX.push(Object.assign({t:+t.toFixed(4),type},o||{}));}
function burst(o){ const r=rng(o.seed??Math.floor(R()*1e9)); const ps=[];
  for(let i=0;i<o.n;i++){ const a0=o.a0??0,a1=o.a1??Math.PI*2; const kinds=o.kinds||['sq','ci','st'];
    ps.push({ang:a0+(a1-a0)*r(),sp:lerp(o.sp[0],o.sp[1],Math.pow(r(),.7)),sz:lerp((o.sz||[6,15])[0],(o.sz||[6,15])[1],r()),
      k:kinds[Math.floor(r()*kinds.length)],c:o.cols[Math.floor(r()*o.cols.length)],rot:r()*6.28,vr:(r()-.5)*14,
      life:o.life*lerp(.55,1,r()),fl:r()*6.28,fv:lerp(5,12,r()),sw:r()*6.28}); }
  BURSTS.push({t:o.t,x:o.x,y:o.y,r0:o.r0||0,k:o.drag??3.2,vt:o.vt??260,life:o.life,ps,lighter:!!o.lighter}); }
function implode(t0,t1,x,y,n){const r=rng(99);const ps=[];for(let i=0;i<n;i++)ps.push({a:r()*6.283,R:lerp(520,1100,r()),d:r()*.35,c:r()<.75?'#FFA51F':'#FF4438',w:lerp(2,5,r())});IMPL.push({t0,t1,x,y,ps});}
const AMB=['#FFA51F','#FFA51F','#FFC25E','#F4F0EA','#FF4438'], REDS=['#FF4438','#FF4438','#FF7A5C','#FFA51F'];

/* ---------- 레이어 ---------- */
const stage=$('stage'), cam=$('cam'), fxC=$('fx'), fx=fxC.getContext('2d'), bgC=$('bg'), bg=bgC.getContext('2d');
const SC=[];
function scene(id,t0,t1){const d=document.createElement('div');d.className='scene';d.id=id;cam.insertBefore(d,fxC);const s={id,t0,t1,el:d,r:null};SC.push(s);return s;}

/* ---------- 로고 (앱 헤더의 계기판 로고) ---------- */
function logoSVG(p,sz){ return `<svg viewBox="0 0 512 512" width="${sz}" height="${sz}" style="overflow:visible;display:block">
<g id="${p}sq"><rect width="512" height="512" rx="112" fill="#10100F"/></g>
<g id="${p}cg"><circle cx="256" cy="256" r="166" fill="#181715" stroke="#373027" stroke-width="10"/></g>
<circle id="${p}tr" cx="256" cy="256" r="126" fill="none" stroke="#30251A" stroke-width="30" pathLength="1" stroke-dasharray="1 1" transform="rotate(133.5 256 256)"/>
<path id="${p}am" d="M165 352a126 126 0 0 1 201-153" fill="none" stroke="#FFA51F" stroke-width="30" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<path id="${p}rd" d="M366 199a126 126 0 0 1 16 71" fill="none" stroke="#FF4438" stroke-width="30" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
<g id="${p}nd"><path d="M256 256h115.5" stroke="#FFA51F" stroke-width="18" stroke-linecap="round"/></g>
<g id="${p}hb"><circle cx="256" cy="256" r="34" fill="#FFA51F"/><circle cx="256" cy="256" r="12" fill="#10100F"/></g>
<path id="${p}bl" d="M146 378h220" stroke="#F4EFE7" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>
</svg>`; }
const MINI_LOGO=`<svg viewBox="0 0 512 512" width="34" height="34" style="display:block"><rect width="512" height="512" rx="112" fill="#10100F"/><circle cx="256" cy="256" r="166" fill="#181715" stroke="#373027" stroke-width="10"/><circle cx="256" cy="256" r="126" fill="none" stroke="#30251A" stroke-width="30"/><path d="M165 352a126 126 0 0 1 201-153" fill="none" stroke="#FFA51F" stroke-width="30" stroke-linecap="round"/><path d="M366 199a126 126 0 0 1 16 71" fill="none" stroke="#FF4438" stroke-width="30" stroke-linecap="round"/><path d="M256 256l87-76" stroke="#FFA51F" stroke-width="18" stroke-linecap="round"/><circle cx="256" cy="256" r="34" fill="#FFA51F"/><circle cx="256" cy="256" r="12" fill="#10100F"/><path d="M146 378h220" stroke="#F4EFE7" stroke-width="12" stroke-linecap="round"/></svg>`;
function logoRefs(p){const g=id=>$(p+id);return {sq:g('sq'),cg:g('cg'),tr:g('tr'),am:g('am'),rd:g('rd'),nd:g('nd'),hb:g('hb'),bl:g('bl')};}
function sc256(el,s){el.setAttribute('transform',`translate(256 256) scale(${f4(Math.max(0,s))}) translate(-256 -256)`);}
function dash(el,p){el.style.strokeDashoffset=f4(1-p);el.style.opacity=p>.002?1:0;}
function setLogo(L,s){ sc256(L.sq,s.sq); sc256(L.cg,s.cg); sc256(L.hb,s.hub); dash(L.tr,s.ring); dash(L.am,s.am); dash(L.rd,s.rd); dash(L.bl,s.bl);
  L.nd.setAttribute('transform',`rotate(${f2(s.nd)} 256 256)`); L.nd.style.opacity=f4(s.ndo); }
const A_START=133.53, A_AMB=332.6, A_RED=366.34, A_REST=318.86; // 바늘 각도 (화면 좌표, 시계방향)

/* ---------- 키네틱 캡션 ---------- */
function cap(parent,o){
  const el=mk(parent,'cap','',`left:${o.x}px;top:${o.y}px;font-size:${o.size}px;line-height:${o.lh||1.22};text-align:${o.align||'left'}`+(o.align==='center'?';width:1920px;left:0':''));
  const words=[]; const r=rng(o.seed||7);
  o.lines.forEach(line=>{ const ln=document.createElement('span'); ln.className='ln';
    line.forEach((wd,i)=>{ const s=document.createElement('span'); s.className='w'+(wd.c?' '+wd.c:''); s.textContent=wd.w;
      let m=null; if(wd.mk!=null){m=document.createElement('i');m.className='mk';s.appendChild(m);}
      ln.appendChild(s); if(i<line.length-1) ln.appendChild(document.createTextNode(' '));
      words.push(Object.assign({},wd,{el:s,mkEl:m,r0:(r()-.5)*24})); });
    el.appendChild(ln); });
  return {el,words,size:o.size};
}
function rcap(c,t){ for(const w of c.words){ const p=pp(t,w.t-LEAD,{y0:c.size*.55,s0:.25,r0:w.r0,f:3.3,z:.36});
    let o=p.o,s=p.s,y=p.y,r=p.r;
    if(w.out!=null&&t>=w.out){const q=inv(w.out,w.out+.16,t);o*=1-q;s*=1-.45*E.iB(q);y-=c.size*.4*E.iC(q);}
    T(w.el,0,y,s,r,o);
    if(w.mkEl) w.mkEl.style.transform=`scaleX(${f4(E.oX(inv(w.mk,w.mk+.3,t)))})`; } }
function typer(el){el.innerHTML='<span></span><i class="cur"></i>';return {el,tx:el.firstChild,cu:el.lastChild,full:el.dataset.t};}
function rtype(ty,str,p){ty.tx.textContent=str.slice(0,Math.round(str.length*p));}

/* ---------- 워드마크 락업 ---------- */
function lockup(parent){
  const wm=mk(parent,'a wm','', 'left:0;top:0;width:1920px;text-align:center');
  const letters=[...'REDLINE'].map((ch,i)=>{const s=document.createElement('span');s.className='wl'+(i<3?' red':'');s.textContent=ch;wm.appendChild(s);return s;});
  const ul=mk(parent,'a','', 'left:0;top:0;height:12px;display:flex;gap:12px');
  const ulA=mk(ul,'','', 'flex:82;height:12px;background:var(--a);transform-origin:0 50%;border-radius:6px');
  const ulR=mk(ul,'','', 'flex:18;height:12px;background:var(--c);transform-origin:0 50%;border-radius:6px');
  const sub=mk(parent,'a','2028 수능 공부 대시보드','left:0;top:0;width:1920px;text-align:center;font-weight:700;font-size:60px;letter-spacing:-.02em;color:var(--t);opacity:0');
  const desc=mk(parent,'a mono','남은 시간 · 순공 기록 · 성적 추이를 한 화면에서','left:0;top:0;width:1920px;text-align:center;font-size:25px;letter-spacing:.1em;color:var(--m);opacity:0');
  return {wm,letters,ul,ulA,ulR,sub,desc,pos:[]};
}
function placeLockup(L,y){ L.wm.style.top=y+'px'; L.y=y;
  const r=L.wm.getBoundingClientRect(), sr=stage.getBoundingClientRect(), k=sr.width/W;
  // 글자 폭 기준으로 밑줄 길이 결정
  const first=L.letters[0].getBoundingClientRect(), last=L.letters[6].getBoundingClientRect();
  const x0=(first.left-sr.left)/k, x1=(last.right-sr.left)/k;
  L.ul.style.left=x0+'px'; L.ul.style.width=(x1-x0)+'px'; L.ul.style.top=(y+232)+'px';
  L.sub.style.top=(y+272)+'px'; L.desc.style.top=(y+372)+'px';
  L.pos=L.letters.map(l=>{const b=l.getBoundingClientRect();return {x:(b.left+b.width/2-sr.left)/k,y:(b.bottom-sr.top)/k};});
  L.ux1=x1; L.uy=y+238;
}
function rLockup(L,t,o){ // o: {t0 letters, ul, sub, desc}
  L.letters.forEach((el,i)=>{ const ti=o.t0+i*.0625; const p=pp(t,ti-LEAD,{y0:170,s0:.15,r0:(i%2?14:-14),f:3.1,z:.34});
    const tau=t-ti; const sq=tau>0?Math.exp(-tau*11)*Math.sin(tau*34)*.16:0;
    T2(el,0,p.y,p.s*(1+sq),p.s*(1-sq),p.r,p.o); });
  const u=E.oX(inv(o.ul,o.ul+.32,t)), u2=E.oB(inv(o.ul+.18,o.ul+.36,t),2.4);

function drawFx(t){ fx.clearRect(0,0,W,H);

  for(const m of IMPL){ if(t<m.t0||t>m.t1)continue; const p=inv(m.t0,m.t1,t);
    for(const q of m.ps){const pp2=clamp((p-q.d)/(1-q.d));if(pp2<=0)continue;const rr0=lerp(q.R,205,E.iC(pp2)),len=(40+220*E.iC(pp2))*(1-.6*E.iC(pp2));
      fx.globalAlpha=Math.min(1,pp2*3)*.85;fx.strokeStyle=q.c;fx.lineWidth=q.w;fx.lineCap='round';fx.beginPath();
      fx.moveTo(m.x+Math.cos(q.a)*rr0,m.y+Math.sin(q.a)*rr0);fx.lineTo(m.x+Math.cos(q.a)*(rr0+len),m.y+Math.sin(q.a)*(rr0+len));fx.stroke();}}
  for(const b of BURSTS){const tau=t-b.t;if(tau<0||tau>b.life)continue; fx.globalCompositeOperation=b.lighter?'lighter':'source-over';
    for(const q of b.ps){ if(tau>q.life)continue; const k=b.k, e=1-Math.exp(-k*tau);
      const v0x=Math.cos(q.ang)*q.sp, v0y=Math.sin(q.ang)*q.sp;
      const x=b.x+Math.cos(q.ang)*b.r0+v0x*e/k + (q.k==='cf'?Math.sin(q.sw+tau*3)*22*Math.min(1,tau):0), y=b.y+Math.sin(q.ang)*b.r0+b.vt*tau+(v0y-b.vt)*e/k;
      const lp=tau/q.life, al=1-sstep(.6,1,lp); fx.globalAlpha=al; fx.fillStyle=q.c; fx.strokeStyle=q.c;

function rect(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect(),k=s.width/W;return {x:(r.left-s.left)/k,y:(r.top-s.top)/k,w:r.width/k,h:r.height/k};}

/* ================= 렌더 ================= */
function renderAt(t){
  drawBg(t); drawMq(t);
  for(const s of SC){ const xf=sceneXf(s,t); if(!xf){s.el.style.display='none';continue;} s.el.style.display='block';
    s.el.style.transform=`translate(${f2(xf.x)}px,${f2(xf.y)}px) scale(${f4(xf.sc)})`; s.el.style.opacity=f4(xf.o);
    if(xf.blur>.5){$('hbS').setAttribute('stdDeviation',`${f2(xf.blur)} 0`);s.el.style.filter='url(#hb)';} else s.el.style.filter='none';
    s.r(t); }
  drawFx(t); rWipe(t); rHud(t);
  const [sx,sy,sr]=shakeAt(t); const kk=kick(t);
  const cs=1+.009*kk;
  cam.style.transform=`translate(${f2(sx)}px,${f2(sy)}px) rotate(${f2(sr)}deg) scale(${f4(cs)})`;
  bgC.style.transform=`translate(${f2(sx*.4)}px,${f2(sy*.4)}px) scale(1.03)`;
  const [fa,fc]=flashAt(t); const fl=$('flash'); fl.style.opacity=f4(fa); fl.style.background=fc;
  const gi=Math.floor(t*FPS)%4; gx.clearRect(0,0,960,540); gx.drawImage(GT[gi],0,0);
}

/* ================= 시작 ================= */
async function boot(){
  const txt=stage.textContent+'D−0123456789,:%h.+ ';

    '800 50px "Saira Condensed"','700 50px "Saira Condensed"','600 50px "Saira Condensed"','400 50px "IBM Plex Mono"','500 50px "IBM Plex Mono"','600 50px "IBM Plex Mono"'];
  await Promise.all(specs.map(s=>document.fonts.load(s,txt).catch(()=>{})));
  await document.fonts.ready;
  // 측정을 위해 잠깐 모두 표시
  SC.forEach(s=>{s.el.style.display='block';s.el.style.transform='none';});
  placeLockup(IL,452); placeLockup(OL,452);

  events();
  SC.forEach(s=>s.el.style.display='none');

  window.READY=true;
  if(!CAPTURE) preview();
}
function preview(){
  const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;};
  addEventListener('resize',fit); fit();
  if(QS.has('t')) return;
  const au=new Audio('soundtrack.m4a'); let t0=performance.now(), useA=false;
  const go=()=>{au.currentTime=0;au.play().then(()=>{useA=true;}).catch(()=>{});t0=performance.now();};
  addEventListener('click',go); au.addEventListener('ended',()=>{useA=false;t0=performance.now();});
  (function loop(){ const t=useA?au.currentTime:((performance.now()-t0)/1000)%DUR; renderAt(t); requestAnimationFrame(loop); })();
}
boot();
