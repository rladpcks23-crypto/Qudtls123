<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부품 분해 모션</title>
<meta name="color-scheme" content="dark">
<style>
:root{ --ink:#0A0908; --text:#F4F0EA; --muted:#9C9186; --amber:#FFA51F; --red:#FF4438; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ink); overflow:hidden; display:grid; place-items:center;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  color:var(--text); word-break:keep-all; -webkit-font-smoothing:antialiased}
#stage{position:relative; width:1920px; height:1080px; flex:none; overflow:hidden;
  background:var(--ink); transform-origin:50% 50%}
#gl{position:absolute; inset:0; width:1920px; height:1080px; display:block}
#scrim{position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(90deg,rgba(10,9,8,.93) 0%,rgba(10,9,8,.74) 32%,rgba(10,9,8,0) 60%)}
.t{position:absolute; left:0; top:0; white-space:pre-line; will-change:transform,opacity}
.kick{font-size:26px; font-weight:800; color:var(--amber); letter-spacing:.06em}
.h1{font-size:104px; font-weight:800; letter-spacing:-.04em; line-height:1.07}
.h2{font-size:60px; font-weight:800; letter-spacing:-.03em; line-height:1.15}
.sub{font-size:30px; color:var(--muted)}
.count{position:absolute; right:70px; bottom:58px; font:800 30px/1
  ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.08em;
  color:var(--muted); font-variant-numeric:tabular-nums}
.count b{color:var(--amber)}
</style>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js"}}
</script>

<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="scrim"></div>
  <div class="t kick" id="k1">3D 모델 분해</div>
  <div class="t h1"   id="t1">부품 하나하나가
따로 움직입니다.</div>
  <div class="t h2"   id="t2">바깥쪽부터
차례로 떨어져 나가고</div>
  <div class="t h2"   id="t3">전부 흩어진 뒤</div>
  <div class="t h2"   id="t4">다시 제자리로
돌아옵니다.</div>
  <div class="t sub"  id="s4">영상이라 어떤 파워포인트에서도 그대로 재생됩니다.</div>
  <div class="count" id="cnt">PARTS <b>000</b></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const clamp = (n, a = 0, b = 1) => n < a ? a : n > b ? b : n;
const Ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const seg = (t, a, b) => Ease(clamp((t - a) / (b - a)));
const DUR = 24;

/* ── 무대 ─────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1920, 1080, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0A0908);
const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 1, 20000);
const rig = new THREE.Group();          // 모델을 세우고 돌리는 축
scene.add(rig);

scene.add(new THREE.HemisphereLight(0xFFF3E2, 0x141018, 1.5));
const key  = new THREE.DirectionalLight(0xFFFFFF, 2.4); key.position.set(4, 6, 5);   scene.add(key);
const rim  = new THREE.DirectionalLight(0xFFA51F, 1.5); rim.position.set(-5, -1, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(0x9FB6D8, 0.8); fill.position.set(-4, 4, -5); scene.add(fill);

/* ── 모델 ─────────────────────────────────────────────── */
const gltf = await new GLTFLoader().loadAsync('./models/model.glb');
const model = gltf.scene;
model.rotation.x = -Math.PI / 2;        // CAD 는 Z 가 위, three.js 는 Y 가 위
rig.add(model);

// 화면에 맞게 크기를 맞춘다
const box = new THREE.Box3().setFromObject(model);
const R = box.getSize(new THREE.Vector3()).length() / 2;
model.scale.setScalar(2.6 / R);
const c = box.getCenter(new THREE.Vector3()).multiplyScalar(2.6 / R);
model.position.sub(c);

/* 부품마다: 제자리, 밀려날 방향, 떠나는 순서 */
const centre = new THREE.Vector3();
const parts = model.children.map(mesh => {
  // 부품 좌표계(모델 단위, 여기서는 mm)에서 잰다 — 옮길 때 쓰는 단위와 같아야 한다
  mesh.geometry.computeBoundingBox();
  mesh.geometry.boundingBox.getCenter(centre);
  const dir = centre.clone();
  if (dir.lengthSq() < 1e-9) dir.set(0, 0, 1);
  return { mesh, home: mesh.position.clone(), dir: dir.normalize(), reach: centre.length() };
});
const far = Math.max(...parts.map(p => p.reach)) || 1;
for (const p of parts) {
  p.norm = p.reach / far;
  p.delay = 0.62 * (1 - p.norm);        // 바깥 부품이 먼저 떠난다
  p.dist = far * (0.30 + p.norm * 0.70);// 바깥일수록 멀리 (모델 단위)
}
parts.sort((a, b) => a.delay - b.delay);

// 바깥으로 갈수록 살짝 따뜻하게 — 눈이 깊이를 읽게 해 준다
const bone = new THREE.Color(0xD8D5CF), warm = new THREE.Color(0xFFA51F);
for (const p of parts) {
  p.mesh.material = new THREE.MeshStandardMaterial({
    color: bone.clone().lerp(warm, Math.pow(p.norm, 1.6) * 0.5),
    metalness: 0.32, roughness: 0.42, flatShading: true,
  });
}
$('cnt').innerHTML = 'PARTS <b>' + String(parts.length).padStart(3, '0') + '</b>';

/* ── 글 ───────────────────────────────────────────────── */
function text(el, t, x, y, inT, outT, rise = 26) {
  const a = Ease(clamp((t - inT) / 0.55)), b = 1 - clamp((t - outT) / 0.4);
  el.style.opacity = Math.min(a, b);
  el.style.transform = `translate(${x}px, ${y + (1 - a) * rise}px)`;
}

/* ── 시간 t 하나로 전부 정해진다 ───────────────────────── */
const tmp = new THREE.Vector3();
function render(t) {
  // 부품마다 제 순서에 맞춰 떠났다가, 역순으로 돌아온다
  let spreadSum = 0;
  for (const p of parts) {
    const out  = seg(t,  3.4 + p.delay,  6.4 + p.delay);
    const back = seg(t, 14.4 + (0.62 - p.delay), 17.8 + (0.62 - p.delay));
    const k = Math.max(0, out - back);
    spreadSum += k;
    tmp.copy(p.dir).multiplyScalar(k * p.dist);
    p.mesh.position.copy(p.home).add(tmp);
  }
  const spread = spreadSum / parts.length;

  rig.rotation.y = -0.5 + t * 0.26;
  rig.rotation.x = 0.16 + Math.sin(t * 0.3) * 0.10;
  rig.position.x = 1.15;                 // 왼쪽 글자리를 비운다

  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const baseZ = 2.5 / Math.sin(Math.min(vFov, hFov) / 2);
  camera.position.set(0, 0, baseZ * (1 + spread * 0.72));
  camera.lookAt(0, 0, 0);

  text($('k1'), t, 150, 360,  0.5,  3.6);
  text($('t1'), t, 150, 420,  0.8,  3.6);
  text($('t2'), t, 150, 440,  4.2,  9.4);
  text($('t3'), t, 150, 480,  9.9, 14.2);
  text($('t4'), t, 150, 420, 14.8, 23.6);
  text($('s4'), t, 154, 650, 15.4, 23.6);

  renderer.render(scene, camera);
}

const fit = () => {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `scale(${s})`;
};
addEventListener('resize', fit); fit();

window.__seek = t => render(t);
window.__dur = DUR;

if (!location.search.includes('manual')) {
  let t0 = null;
  const loop = now => {
    if (t0 === null) t0 = now;
    render(((now - t0) / 1000) % DUR);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
} else {
  render(0);
}
</script>
